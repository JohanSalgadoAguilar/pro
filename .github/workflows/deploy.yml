name: Deploy a InfinityFree

# Este bloque define cuándo se ejecutará la acción
on:
  push:
    branches:
      - master  # Indica que se activará cada vez que hagas push a la rama master

jobs:
  web-deploy:
    name: Subiendo cambios vía FTP
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo del repositorio
        uses: actions/checkout@v4

      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/ # Carpeta de destino en el servidor